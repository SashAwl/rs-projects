<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../assets/icons/snowflake.svg" type="image/x-icon">
    <link rel="stylesheet" href="../gifts/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Gift</title>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="../../assets/icons/snowflake.svg" class="logo__img" alt="logo">
                <a class="logo__link" href="../../index.html">
                    <h1 class="heading heading-small">the gifts</h1>
                </a>
            </div>
            <nav class="menu">
                <div class="burger">
                    <div class="burger__line line-top"></div>
                    <div class="burger__line line-bottom"></div>
                </div>
                <ul class="menu__list">
                    <li class="menu-item menu-item-checked"><a href="#"
                            class="heading heading-small menu__gifts checked-red selected-tag">gifts</a></li>
                    <li class="menu-item"><a href="../../index.html#about"
                            class="heading heading-small menu__about">about</a></li>
                    <li class="menu-item"><a href="../../index.html#best"
                            class="heading heading-small menu__best">best</a>
                    </li>
                    <li class="menu-item"><a href="#contacts" class="heading heading-small menu_contacts">contacts</a>
                    </li>
                </ul>
            </nav>
        </header>
        <main class="gift">
            <div class="gift__top">
                <h2 class="heading heading-top">Achieve health, harmony, and inner strength</h2>
            </div>
            <div class="gift__tags">
                <button class="tag-selection heading heading-small heading-small--white selected-tag">all</button>
                <button class="tag-selection heading heading-small heading-small--white">for work</button>
                <button class="tag-selection heading heading-small heading-small--white">for health</button>
                <button class="tag-selection heading heading-small heading-small--white">for harmony</button>
            </div>
            <div class="gift__box">
            </div>
        </main>
        <svg class="scroll-to-top" width="24" height="24" viewBox="0 0 24 24" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19" stroke="#FF4646" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M18 11L12 5" stroke="#FF4646" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M6 11L12 5" stroke="#FF4646" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <footer class="footer">
            <div class="footer__contacts" id="contacts">
                <div class="card-item">
                    <img src="../../assets/images/santa.png" alt="santa" class="card-item__img">
                    <h4 class="heading heading-mini"><a class="card-item__link" href="tel:+136741111111">+375 (29)
                            111-22-33</a></h4>
                    <h3 class="heading heading-gift-item">call us</h3>
                </div>
                <div class="card-item">
                    <img src="../../assets/images/tree.png" alt="tree" class="card-item__img">
                    <h4 class="heading heading-mini"><a class="card-item__link" target="_blank"
                            href="https://www.google.ru/maps/d/u/0/viewer?mid=1MYMUtFSQWXoEI8IkBFUypCjsWME&hl=ru&ll=19.000113603109977%2C72.98965144512044&z=11">Magic
                            forest</a></h4>
                    <h3 class="heading heading-gift-item">meet us</h3>
                </div>
                <div class="card-item">
                    <img src="../../assets/images/snake.svg" alt="snake" class="card-item__img">
                    <h4 class="heading heading-mini"><a class="card-item__link"
                            href="mailto:mail@shelter.ru">gifts@magic.com</a>
                    </h4>
                    <h3 class="heading heading-gift-item">write us</h3>
                </div>
            </div>
            <div class="footer__bottom">
                <div class="social-networks">
                    <a href="https://t.me/" target="_blank"><img src="../../assets/icons/telegram.svg"
                            alt="telegram"></a>
                    <a href="http://facebook.com" target="_blank"><img src="../../assets/icons/facebook.svg"
                            alt="facebook"></a>
                    <a href="https://instagram.com" target="_blank"><img src="../../assets/icons/instagram.svg"
                            alt="instagram"></a>
                    <a href="https://x.com" target="_blank"><img src="../../assets/icons/X.svg" alt="x"></a>
                </div>
                <h3 class="heading heading-bottom">© Copyright 2025, All Rights Reserved</h3>
                <h4 class="elegant-text"><a class="rs-link" href="https://rs.school/" target="_blank">Made in Rolling
                        Scopes
                        School</a></h4>
            </div>
        </footer>
    </div>

    <script src="../../scripts/burger-menu.js"></script>
    <script src="../../scripts/gift-cards.js"></script>
    <script src="./index.js"></script>
</body>

</html>
